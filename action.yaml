name: 'The PR Agent'
description: 'Summarize, review and suggest improvements for pull requests'
branding:
  icon: 'award'
  color: 'green'

inputs:
  github_token:
    description: 'GitHub token (defaults to the built-in GITHUB_TOKEN)'
    required: false
    default: ${{ github.token }}
  anthropic_key:
    description: 'Anthropic API key for Claude models'
    required: true
  model:
    description: 'Claude model ID to use for reviews'
    required: false
    default: 'claude-sonnet-4-6'
  zoho_enabled:
    description: 'Enable Zoho Sprints ticket context (true/false)'
    required: false
    default: 'false'
  zoho_domain:
    description: 'Zoho domain — zoho.in or zoho.com'
    required: false
    default: 'zoho.in'
  zoho_team_id:
    description: 'Zoho Sprints team ID'
    required: false
    default: ''
  zoho_client_id:
    description: 'Zoho OAuth client ID'
    required: false
    default: ''
  zoho_client_secret:
    description: 'Zoho OAuth client secret'
    required: false
    default: ''
  zoho_refresh_token:
    description: 'Zoho OAuth refresh token'
    required: false
    default: ''
  zoho_repo_project_map:
    description: 'JSON map of repo names to Zoho project IDs, e.g. {"my-repo":{"project_id":"123"}}'
    required: false
    default: '{}'

runs:
  using: 'composite'
  steps:
    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install PR Agent
      run: pip install -e "${{ github.action_path }}"
      shell: bash

    - name: Run PR Agent
      run: python -m pr_agent.servers.github_action_runner
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github_token }}
        ANTHROPIC__KEY: ${{ inputs.anthropic_key }}
        CONFIG__MODEL: ${{ inputs.model }}
        CONFIG__FALLBACK_MODELS: '["claude-haiku-4-5-20251001"]'
        CONFIG__PUBLISH_OUTPUT: 'true'
        GITHUB_ACTION_CONFIG__AUTO_DESCRIBE: 'false'
        GITHUB_ACTION_CONFIG__AUTO_IMPROVE: 'false'
        ZOHO_SPRINTS__ENABLED: ${{ inputs.zoho_enabled }}
        ZOHO_SPRINTS__DOMAIN: ${{ inputs.zoho_domain }}
        ZOHO_SPRINTS__TEAM_ID: ${{ inputs.zoho_team_id }}
        ZOHO_SPRINTS__CLIENT_ID: ${{ inputs.zoho_client_id }}
        ZOHO_SPRINTS__CLIENT_SECRET: ${{ inputs.zoho_client_secret }}
        ZOHO_SPRINTS__REFRESH_TOKEN: ${{ inputs.zoho_refresh_token }}
        ZOHO_SPRINTS__REPO_PROJECT_MAP: ${{ inputs.zoho_repo_project_map }}
        PR_REVIEWER__REQUIRE_TICKET_ANALYSIS_REVIEW: 'true'
