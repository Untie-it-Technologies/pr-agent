# PR Agent — automatic review workflow (self-hosted on this repo)
#
# Events handled:
#   pull_request (opened / reopened / ready_for_review)  → full /review
#   pull_request (synchronize — new commits)             → incremental /review -i
#   issue_comment (created)                              → manual /review, /describe, /improve
#
# Required secrets (Settings → Secrets and variables → Actions):
#   ANTHROPIC_KEY                  — Anthropic API key
#   ZOHO_SPRINTS__CLIENT_ID        — Zoho OAuth client ID
#   ZOHO_SPRINTS__CLIENT_SECRET    — Zoho OAuth client secret
#   ZOHO_SPRINTS__REFRESH_TOKEN    — Zoho OAuth refresh token
#   ZOHO_SPRINTS__TEAM_ID          — Zoho Sprints team ID
#   ZOHO_SPRINTS__REPO_PROJECT_MAP — JSON: {"repo-name":{"project_id":"..."}}

name: PR Agent

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
  issue_comment:
    types: [created]

permissions:
  issues: write
  pull-requests: write
  contents: read

jobs:
  pr_agent_job:
    if: |
      (github.event_name == 'pull_request' && github.event.pull_request.draft == false) ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request != null &&
       !contains(github.event.comment.body, 'pr-agent-sha:'))
    runs-on: ubuntu-latest
    name: Run PR Agent
    steps:
      - name: PR Agent
        uses: ./
        with:
          anthropic_key: ${{ secrets.ANTHROPIC_KEY }}
          zoho_enabled: 'true'
          zoho_team_id: ${{ secrets.ZOHO_SPRINTS__TEAM_ID }}
          zoho_client_id: ${{ secrets.ZOHO_SPRINTS__CLIENT_ID }}
          zoho_client_secret: ${{ secrets.ZOHO_SPRINTS__CLIENT_SECRET }}
          zoho_refresh_token: ${{ secrets.ZOHO_SPRINTS__REFRESH_TOKEN }}
          zoho_repo_project_map: ${{ secrets.ZOHO_SPRINTS__REPO_PROJECT_MAP }}
